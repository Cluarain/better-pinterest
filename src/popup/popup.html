<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BetterPinterest</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="logo" aria-hidden="true"></span>
      <div class="header-text">
        <h1 class="title">BetterPinterest</h1>
        <p class="subtitle">UI tweaks applied immediately</p>
      </div>
    </header>

    <main id="featureList" class="list" aria-label="BetterPinterest toggles">
      <!-- feature rows are rendered by popup.js -->
    </main>

    <footer class="footer">
      <span id="status" class="status">Ready</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
